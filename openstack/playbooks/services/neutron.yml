---
- name: Create and configure MySQL databases for OpenStack
  hosts: controller
  become: yes

  vars:
    # mysql_root_password: "openstack"
    databases:
      - db_name: "neutron"
    db_user: "neutron"
    db_password: "openstack"
    admin_access: "/root/admin-openrc"
    service_user: "neutron"
    service_password: "openstack"


  tasks:
    # - name: Create databases
    #   include_tasks: ./tasks/database_create.yml
    #   loop: "{{ databases }}"
    #   loop_control:
    #     loop_var: db_info
    #   vars:
    #     db_name: "{{ db_info.db_name }}"

    - name: Admin credentials to gain access
      shell: ". {{ admin_access }}"

    - name: Create nova user in OpenStack
      include_tasks: ./tasks/user_create.yml
      vars:
        user_name: "{{ service_user }}"
        user_password: "{{ service_password }}"

