---
- name: Setup NFS Client for OpenStack
  hosts: nfs_endpoints
  become: yes
  tasks:
    - name: Install NFS client
      apt:
        name: nfs-common
        state: present
        update_cache: yes

    - name: Create mount point for NFS
      file:
        path: "{{ nfs_mountpoint }}"
        state: directory
        mode: '0755'

    - name: Mount NFS share
      mount:
        path: "{{ nfs_mountpoint }}"
        src: "{{ nfs_server_ip }}:{{ nfs_path }}"
        fstype: nfs
        opts: defaults
        state: mounted

    - name: Create directories
      file:
        path: "{{ nfs_mountpoint }}/{{ item }}"
        state: directory
        mode: '0755'
      loop:
        - glance
        - cinder
        - backup