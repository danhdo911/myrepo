---
- name: Install and configure Etcd for OpenStack
  hosts: controller
  become: yes

  vars:
    etcd_name: "controller"
    etcd_data_dir: "/var/lib/etcd"
    etcd_initial_cluster_state: "new"
    etcd_initial_cluster_token: "etcd-cluster-01"
    etcd_initial_cluster: "controller=http://{{ controller_mgmt_ip }}:2380"
    etcd_initial_advertise_peer_urls: "http://{{ controller_mgmt_ip }}:2380"
    etcd_advertise_client_urls: "http://{{ controller_mgmt_ip }}:2379"
    etcd_listen_peer_urls: "http://0.0.0.0:2380"
    etcd_listen_client_urls: "http://{{ controller_mgmt_ip }}:2379"

  tasks:
    - name: Install Etcd
      apt:
        name: etcd
        state: present
        update_cache: yes

    - name: Set Etcd configuration
      blockinfile:
        path: /etc/default/etcd
        create: yes
        block: |
          ETCD_NAME="{{ etcd_name }}"
          ETCD_DATA_DIR="{{ etcd_data_dir }}"
          ETCD_INITIAL_CLUSTER_STATE="{{ etcd_initial_cluster_state }}"
          ETCD_INITIAL_CLUSTER_TOKEN="{{ etcd_initial_cluster_token }}"
          ETCD_INITIAL_CLUSTER="{{ etcd_initial_cluster }}"
          ETCD_INITIAL_ADVERTISE_PEER_URLS="{{ etcd_initial_advertise_peer_urls }}"
          ETCD_ADVERTISE_CLIENT_URLS="{{ etcd_advertise_client_urls }}"
          ETCD_LISTEN_PEER_URLS="{{ etcd_listen_peer_urls }}"
          ETCD_LISTEN_CLIENT_URLS="{{ etcd_listen_client_urls }}"
      notify: restart etcd

    - name: Enable Etcd service
      systemd:
        name: etcd
        enabled: true
        state: started

  handlers:
    - name: restart etcd
      service:
        name: etcd
        state: restarted
