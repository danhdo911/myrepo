---
- name: Ensure monitor directory is exist
  ansible.builtin.file:
    path: "{{ monitoring_dir }}"
    state: directory
    owner: root
    group: root
    mode: '0755'

- name: Copy docker compose service template
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: "{{ monitoring_dir }}/docker-compose.yml"
    owner: root
    group: root
    mode: "0644"

- name: Deploy exporter service
  community.docker.docker_compose_v2:
    project_src: "{{ monitoring_dir }}"
    state: present