---
- name: Build proxy URLs
  set_fact:
    http_proxy_url:  "http://{{ proxy_host }}:{{ proxy_port }}"
    https_proxy_url: "http://{{ proxy_host }}:{{ proxy_port }}"
    no_proxy_csv: "{{ no_proxy_list | default([]) | join(',') }}"

- name: Ensure /etc/environment contains proxy vars
  ansible.builtin.blockinfile:
    path: /etc/environment
    create: true
    marker: "# {mark} MANAGED PROXY"
    block: |
      HTTP_PROXY="{{ http_proxy_url }}"
      HTTPS_PROXY="{{ https_proxy_url }}"
      NO_PROXY="{{ no_proxy_csv }}"
  when:
    - proxy_enabled | default(false) | bool

- name: Remove proxy settings when proxy disabled
  ansible.builtin.blockinfile:
    path: /etc/environment
    marker: "# {mark} MANAGED PROXY"
    state: absent
  when:
    - not (proxy_enabled | default(false) | bool)

- name: Configure apt proxy
  ansible.builtin.copy:
    dest: "/etc/apt/apt.conf.d/{{ proxy_file_name }}"
    mode: "0644"
    content: |
      Acquire::http::Proxy "{{ http_proxy_url }}/";
      Acquire::https::Proxy "{{ https_proxy_url }}/";
  when:
    - proxy_enabled | default(false) | bool
  notify: apt-update

- name: Remove apt proxy config when proxy disabled
  ansible.builtin.file:
    path: "/etc/apt/apt.conf.d/{{ proxy_file_name }}"
    state: absent
  when:
    - not (proxy_enabled | default(false) | bool)
  notify: apt-update
