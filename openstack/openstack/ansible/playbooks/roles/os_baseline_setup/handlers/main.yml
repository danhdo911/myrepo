---
# Netplan handlers
- name: generate-netplan
  ansible.builtin.command: netplan generate
  changed_when: false

- name: apply-netplan
  ansible.builtin.command: netplan apply

# Proxy handlers
- name: apt-update
  ansible.builtin.apt:
    update_cache: yes

# Chrony handlers
- name: restart-chrony
  ansible.builtin.service:
    name: chrony
    state: restarted
    enabled: yes

# Docker handlers
- name: start-docker
  ansible.builtin.service:
    name: docker
    state: started
    enabled: yes

# SSH handlers
- name: restart-ssh
  ansible.builtin.systemd_service:
    name: ssh
    state: restarted
    enabled: yes