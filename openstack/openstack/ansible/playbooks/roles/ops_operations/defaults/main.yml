---
### Skyline RBAC Policy - Custom roles
openstack_custom_roles:
  - iaas_admin
  - compute_operator
  - volume_operator
  - network_operator
  - network_sec_operator
  - image_operator
  - vm_console
  - no_access

openstack_custom_implied_roles:
  - iaas_admin
  - compute_operator
  - vm_console

