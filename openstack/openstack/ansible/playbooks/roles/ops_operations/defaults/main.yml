### QoS Volume
qos_volume_enabled: false
openstack_qos_volume:
  - name: "qos-iops-2k"
    total_iops_sec: 2000
    volume_type: "nimble-iops-2k"

  - name: "qos-iops-4k"
    total_iops_sec: 4000
    volume_type: "nimble-iops-4k"

  - name: "qos-iops-8k"
    total_iops_sec: 8000
    volume_type: "nimble-iops-8k"

  - name: "qos-iops-10k"
    total_iops_sec: 10000
    volume_type: "nimble-iops-10k"
    
  - name: "qos-iops-20k"
    total_iops_sec: 20000
    volume_type: "nimble-iops-20k"

private_volumes:
