---
- name: Ensure Kolla Ansible configuration directory for Neutron exists
  ansible.builtin.file:
    path: "{{ kolla_config_neutron_dir }}"
    state: directory
    owner: root
    group: root
    mode: '0755'

- name: Neutron ML2 configuration file for Kolla Ansible
  ansible.builtin.template:
    src: neutron/ml2_conf.ini.j2
    dest: "{{ kolla_config_neutron_dir }}/ml2_conf.ini"
    owner: root
    group: root
    mode: '0644'
