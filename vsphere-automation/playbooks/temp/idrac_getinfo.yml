      - name: Filter NICs with status Up and extract MAC addresses
        set_fact:
          nics_up_mac_addresses: "{{ idrac_facts.system_info.NIC | selectattr('LinkStatus', 'equalto', 'Up') | map(attribute='CurrentMACAddress') | list }}"

      # Replace colons with hyphens and convert to lowercase for MAC Address
      - name: Transform MAC addresses 
        set_fact:
          mac_addresses_transformed: "{{ nics_up_mac_addresses | map('lower') | map('replace', ':', '-') | list }}"

      - name: Debug MAC addresses of NICs with status Up
        debug:
          msg: "{{ mac_addresses_transformed }}"