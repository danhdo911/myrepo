---
  - block:
      # - name: Create vDS BackupNFC portgroup
      #   community.vmware.vmware_dvs_portgroup:
      #     hostname: "{{ vcenter_hostname }}"
      #     username: "{{ vcenter_username }}"
      #     password: "{{ vcenter_password }}"
      #     validate_certs: "{{ vcenter_validate_certs }}"
      #     portgroup_name: "{{ vds_backupnfc_pg_name }}"
      #     switch_name: "{{ vds_switch02 | default({{ vds_switch01 }}) }}"
      #     vlan_id: "{{ vds_backupnfc_pg_vlanid }}"
      #     num_ports: 48
      #     port_binding: static
      #     state: present
      #   delegate_to: localhost

      - name: Add BackupNFC vmkernel port with Default TCP/IP stack
        community.vmware.vmware_vmkernel:
          hostname: "{{ vcenter_hostname }}"
          username: "{{ vcenter_username }}"
          password: "{{ vcenter_password }}"
          validate_certs: "{{ vcenter_validate_certs }}"
          esxi_hostname: "{{ item.esxi_hostname }}"
          # Specific Configuration
          dvswitch_name: "{% if vds_switch02 | default(None) not in [None, ''] %}{{ vds_switch02 }}{% else %}{{ vds_switch01 }}{% endif %}"
          portgroup_name: "{{ vds_backupnfc_pg_name }}"
          mtu: "{{ mtu_vmkernel | default(9000) }}"
          enable_backup_nfc: true
          network:
            type: "static"
            ip_address: "{{ item.esxi_backupnfc_ip }}"
            subnet_mask: "{{ vds_backupnfc_netmask }}"
            default_gateway: "{{ vds_backupnfc_gateway }}"
          state: present
        loop: "{{ esxi_info }}"
        when:
          item.esxi_backupnfc_ip is defined
        delegate_to: localhost

    when: >
      vds_backupnfc_pg_name is defined and
      vds_backupnfc_gateway is defined and
      vds_backupnfc_netmask is defined and
      vds_backupnfc_pg_vlanid is defined