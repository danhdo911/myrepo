---
- name: Initialize registration status
  set_fact:
    _esxi_running: {}
    _esxi_registered: {}
    _esxi_maintenancemode: {}

- name: Check whether ESXi is running
  wait_for:
    host: "{{ item.esxi_hostname }}"
    port: 443
    timeout: 10
  loop: "{{ esxi_inventory }}"
  register: _wait_result
  ignore_errors: true
  delegate_to: localhost

- name: Mark hosts as running or not
  set_fact:
    _esxi_running: >-
      {{
        _esxi_running | default({}) |
        combine({ item.item.esxi_hostname: (item.failed is not defined or not item.failed) })
      }}
  loop: "{{ _wait_result.results }}"

- name: Filter running ESXi hosts for next task
  set_fact:
    _running_hosts: "{{ _esxi_running | dict2items | selectattr('value', 'equalto', true) | map(attribute='key') | list }}"

# - name: Show host running status
#   debug:
#     var: _esxi_running

# - name: Show only running hosts
#   debug:
#     var: _running_hosts

- name: Check whether ESXi is in maintenance mode (only for running hosts)
  block:
    - name: Gather ESXi facts
      community.vmware.vmware_host_facts:
        hostname: "{{ item }}"
        username: "{{ esxi_username }}"
        password: "{{ esxi_password }}"
        validate_certs: "{{ vcenter_validate_certs }}"
        schema: vsphere
        properties:
          - runtime.inMaintenanceMode
      loop: "{{ _running_hosts }}"
      register: _esxi_facts_maintenance
      delegate_to: localhost

    - name: Set "esxi is in maintenance mode" flag per host
      set_fact:
        _esxi_maintenancemode: "{{ _esxi_maintenancemode | combine({ item.item: (item.ansible_facts.runtime.inMaintenanceMode | bool) }) }}"
      loop: "{{ _esxi_facts_maintenance.results }}"
      when: item.ansible_facts.runtime is defined

  rescue:
    - name: Mark hosts as not in maintenance mode if fact gathering fails
      set_fact:
        _esxi_maintenancemode: "{{ _esxi_maintenancemode | combine({ item.item: false }) }}"
      loop: "{{ _esxi_facts_maintenance.results }}"
      when: item.failed is defined and item.failed

- name: Filter ESXi hosts in maintenance mode for next task
  set_fact:
    _maintenancemode_hosts: "{{ _esxi_maintenancemode | dict2items | selectattr('value', 'equalto', true) | map(attribute='key') | list }}"

- name: Check whether ESXi is registered on vCenter (only for maintenance mode hosts)
  block:
    - name: Gather ESXi registration status from vCenter
      community.vmware.vmware_host_facts:
        hostname: "{{ vcenter_hostname }}"
        username: "{{ vcenter_username }}"
        password: "{{ vcenter_password }}"
        validate_certs: "{{ vcenter_validate_certs }}"
        esxi_hostname: "{{ item }}"
        schema: vsphere
        properties:
          - runtime.connectionState
          - runtime.powerState
      loop: "{{ _maintenancemode_hosts }}"
      register: _esxi_facts
      delegate_to: localhost

    - name: Set "esxi is registered" flag per host
      set_fact:
        _esxi_registered: "{{ _esxi_registered | combine({ item.item: true }) }}"
      loop: "{{ _esxi_facts.results }}"
      when: >
        item.ansible_facts.runtime.connectionState == 'connected' and
        item.ansible_facts.runtime.powerState == 'poweredOn'

  rescue:
    - name: Mark hosts as not registered
      set_fact:
        _esxi_registered: "{{ _esxi_registered | combine({ item.item: false }) }}"
      loop: "{{ _esxi_facts.results }}"
      when: item.failed is defined and item.failed

- name: Filter ESXi hosts that are running, in maintenance mode, and not registered
  set_fact:
    _ready_hosts: "{{ _esxi_registered | dict2items | selectattr('value', 'equalto', false) | map(attribute='key') | list }}"

- name: Fail if no eligible ESXi hosts found
  fail:
    msg: "No eligible ESXi hosts found that are running, in maintenance mode, and not registered."
  when: _ready_hosts | length == 0