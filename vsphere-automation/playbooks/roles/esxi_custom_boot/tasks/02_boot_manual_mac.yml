---
# tasks file for esxi-custom-boot
## Manual declare MAC from iDRAC and generate custom boot file
### Modifile boot.cfg from source ISO

- name: Copy boot files
  copy:
    src: "{{ item }}"
    dest: "{{ global_path_tftpboot }}"
  loop:
    - pxelinux.0
    - menu.c32
    - mboot.efi 
    - crypto64.efi

- name: Remove all slashes in boot.cfg
  replace:
    path: "{{ global_path_tftpboot }}/{{ item.esxi_version }}/boot.cfg"
    regexp: '/'
    replace: ''
    backup: yes
  loop: "{{ esxi_inventory }}"
  
### UEFI Boot Mode
- name: "Create folder with ESXi MAC Address"
  file:
    path: "{{ global_path_tftpboot }}/01-{{ item.esxi_macaddr }}"
    state: directory
    mode: '0755'
  loop: "{{ esxi_inventory }}"
  register: esxiboot_dirs

- name: "Symlink file mboot.efi"
  file:
    src: "{{ global_path_tftpboot }}/mboot.efi"
    dest: "{{ global_path_tftpboot }}/01-{{ item.esxi_macaddr }}/mboot.efi"
    state: link
    force: true
  loop: "{{ esxi_inventory }}"
  when: esxiboot_dirs is succeeded

- name: Copy boot.cfg from ISO source
  copy:
    src: "{{ global_path_tftpboot }}/{{ item.esxi_version }}/boot.cfg"
    dest: "{{ global_path_tftpboot }}/01-{{ item.esxi_macaddr }}/boot.cfg"
    remote_src: yes
  loop: "{{ esxi_inventory }}"
  when: esxiboot_dirs is succeeded

- name: Modify kernelopt configuration
  lineinfile:
    path: "{{ global_path_tftpboot }}/01-{{ item.esxi_macaddr }}/boot.cfg"
    regexp: '^kernelopt=.*'
    line: >-
      kernelopt=ks={{ global_http_ksconfig }}/{{ item.esxi_macaddr }}.cfg
      ip={{ item.esxi_mgmt_ip }}
      netmask={{ dhcp_mask }}
      {% if dhcp_vlanid | default(None) not in [None, ''] %}vlanid={{ dhcp_vlanid }}{% endif %}
    backrefs: yes
  loop: "{{ esxi_inventory }}"

- name: Modify prefix configuration
  lineinfile:
    path: "{{ global_path_tftpboot }}/01-{{ item.esxi_macaddr }}/boot.cfg"
    regexp: '^prefix=.*'
    line: 'prefix={{ item.esxi_version }}'
    backrefs: yes
  loop: "{{ esxi_inventory }}"

- name: "Create custom boot file for BIOS mode"
  template:
    src: boot_menu.j2
    dest: "{{ global_pxelinux_cfg }}/01-{{ item.esxi_macaddr }}"
  loop: "{{ esxi_inventory }}"
  when: esxiboot_dirs is succeeded