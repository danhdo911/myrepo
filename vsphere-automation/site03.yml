---
  - hosts: localhost
    gather_facts: false
    connection: local

    tasks:
      - ansible.builtin.include_tasks: "{{ vsphere_role_directory }}63_load_esxi_hosts.yml"

      - ansible.builtin.include_tasks: "{{ vsphere_role_directory }}44_esxi_checkvds.yml"
        when: >
          esxi_info | length > 0

      # 3 - Make sure vSwitch0 release the vmnic second
      - ansible.builtin.include_tasks: "{{ vsphere_role_directory }}91_vsphere_vss_vmnic_remove.yml"
        loop: "{{ esxi_info }}"
        when: >
          esxi_info | length > 0 and
          item.esxi_hostname not in (_vds_esxi_info.distributed_virtual_switches | selectattr('configure', 'defined') | map(attribute='configure') | map(attribute='hosts') | flatten | list)

      # 4 - Migrate vSS to vDS - vmk0 - Management
      - ansible.builtin.include_tasks: "{{ vsphere_role_directory }}06_vsphere_migrate_vss_to_vds.yml"
        loop: "{{ esxi_info }}"
        when: >
          esxi_info | length > 0 and
          item.esxi_hostname not in (_vds_esxi_info.distributed_virtual_switches | selectattr('configure', 'defined') | map(attribute='configure') | map(attribute='hosts') | flatten | list)