---
- name: Deploy DB instances
  hosts: all
  become: true
  roles:
    - common
  tags:
    - common

- name: Setup MySQL
  hosts: mysql
  become: true
  roles:
    - geerlingguy.mysql
  tags:
    - mysql

- name: Setup HAProxy
  hosts: haproxy
  become: true
  roles:
    - geerlingguy.haproxy
  tags:
    - haproxy

- name: Setup Keepalive
  hosts: keepalive
  become: true
  roles:
    - keepalive
  tags:
    - keepalive