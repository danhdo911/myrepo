---
  - name: Disable the ufw firewall (on Ubuntu, if configured).
    service:
      name: ufw
      state: stopped
      enabled: false
    when:
      - ansible_distribution == "Ubuntu"

  # - name: Clean old cache
  #   ansible.builtin.apt:
  #     clean: yes

  # - name: Update package list
  #   ansible.builtin.apt:
  #     update_cache: yes

  # - name: Upgrade all packages
  #   ansible.builtin.apt:
  #     upgrade: dist
  #     autoremove: yes
  #     autoclean: yes

  - name: Install common packages
    ansible.builtin.apt:
      name:
        - nano
        - iputils-ping
        - net-tools
        - glances
        - curl
        - jq
      state: present

  - name: Set timezone
    timezone:
      name: Asia/Ho_Chi_Minh


  # - name: Enable root login in SSH config
  #   lineinfile:
  #     path: /etc/ssh/sshd_config
  #     regexp: '^PermitRootLogin'
  #     line: 'PermitRootLogin yes'
  #     state: present

  - name: Allow password authentication in SSH
    lineinfile:
      path: /etc/ssh/sshd_config
      regexp: '^PasswordAuthentication'
      line: 'PasswordAuthentication yes'
      state: present

  - name: Restart SSH service
    systemd:
      name: ssh
      state: restarted
      enabled: yes

