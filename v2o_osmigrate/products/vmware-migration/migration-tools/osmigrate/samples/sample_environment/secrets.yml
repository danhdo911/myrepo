### VMWARE AUTHENTICATION
vcenter_hostname: "{{ lookup('ansible.builtin.env', 'VMWARE_HOST') }}"
vcenter_username: "{{ lookup('ansible.builtin.env', 'VMWARE_USER') }}"
vcenter_password: "{{ lookup('ansible.builtin.env', 'VMWARE_PASSWORD') }}"
vcenter_datacenter: "{{ lookup('ansible.builtin.env', 'VMWARE_DATACENTER') }}"
validate_certs: false

### OPENSTACK AUTHENTICATION
os_cloud_environ: ver1.0

### For use Certificate
dst_cloud:
  auth:
    auth_url: "{{ lookup('ansible.builtin.env', 'OS_AUTH_URL') }}"
    username: "{{ lookup('ansible.builtin.env', 'OS_USERNAME') }}"
    password: "{{ lookup('ansible.builtin.env', 'OS_PASSWORD') }}"
    project_id: "{{ lookup('ansible.builtin.env', 'OS_PROJECT_ID') }}"
    project_name: "{{ lookup('ansible.builtin.env', 'OS_PROJECT_NAME') }}"
    user_domain_name: "{{ lookup('ansible.builtin.env', 'OS_USER_DOMAIN_NAME') }}"
  region_name: "{{ lookup('ansible.builtin.env', 'OS_REGION_NAME') }}"
  interface: "{{ lookup('ansible.builtin.env', 'OS_INTERFACE') }}"
  identity_api_version: "{{ lookup('ansible.builtin.env', 'OS_IDENTITY_API_VERSION') | int }}"  
  ### For use Certificate
  insecure: false
  ca_cert: "{{ lookup('ansible.builtin.env', 'OS_CACERT') }}"
  ### For bypass Certificate
  # insecure: true
  # verify: false