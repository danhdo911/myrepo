---
version: 3

images:
  base_image:
    name: quay.io/centos/centos:stream9

dependencies:
  ansible_core:
    package_pip: "ansible-core~=2.21.0"

  ansible_runner:
    package_pip: "ansible-runner~=2.4.0"

  system: bindep.txt
  galaxy: requirements.yml
  python: requirements.txt

  python_interpreter:
    package_system: "python3.12"
    python_path: "/usr/bin/python3.12"

additional_build_files:
  - src: certs
    dest: certs
  
  - src: patches
    dest: patches

additional_build_steps:
  append_final:
    # Grant permisions for exporting metadata
    - RUN mkdir -p /opt/os-migrate
    - RUN chgrp -R 0 /opt/os-migrate
    - RUN chmod -R g=u /opt/os-migrate

    # CA certificates of VMware and OpenStack
    - COPY _build/certs/openstack/*.crt /etc/pki/ca-trust/source/anchors/
    - COPY _build/certs/vmware/*.crt /etc/pki/ca-trust/source/anchors/
    - RUN update-ca-trust extract

    # Patching
    - ARG OS_MIGRATE_VERSION
    - ARG CUSTOM_PATCHES=true
    - COPY _build/patches/ /tmp/patches/
    - RUN bash /tmp/patches/apply_patches.sh
    - RUN rm -rf /tmp/patches/
