---
- name: Gather migrated volume ids
  hosts: infra
  become: true
  gather_facts: false

  vars:
    remote_volume_mapping_script: scripts/get_ops_volume_ids.sh
    remote_volume_mapping_file: /tmp/vm_volumes_mapping.yml

  tasks:
    - name: Load Readiness Inventory
      ansible.builtin.set_fact:
        readiness_inventory: >-
          {{
            lookup('ansible.builtin.file', vm_data_readiness)
            | from_json
          }}
      no_log: true

    - name: Initialize remote volume mapping file
      ansible.builtin.copy:
        dest: "{{ remote_volume_mapping_file }}"
        content: |
          vm_volumes_mapping:
        mode: "0644"
      delegate_to: "{{ groups['infra'][0] }}"
      run_once: true

    - name: Export volume mapping for each VM
      ansible.builtin.script:
        cmd: >
          "{{ remote_volume_mapping_script }}"
          "{{ vm.key }}"
          "{{ remote_volume_mapping_file }}"
      loop: "{{ readiness_inventory | dict2items }}"
      loop_control:
        loop_var: vm
        label: "{{ vm.key }}"
      delegate_to: "{{ groups['infra'][0] }}"
      register: volume_mapping_export

    - name: Fetch volume mapping to Ansible controller
      ansible.builtin.fetch:
        src: "{{ remote_volume_mapping_file }}"
        dest: "{{ vm_volumes_mapping_file }}"
        flat: true
      delegate_to: "{{ groups['infra'][0] }}"
      run_once: true

    - name: Load exported volume mapping
      ansible.builtin.include_vars:
        file: "{{ vm_volumes_mapping_file }}"