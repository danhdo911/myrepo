---
- name: Collect Volume IDs After Volumes Migration Successfully
  ansible.builtin.import_playbook: gather_volume_ids.yml
  tags:
    - volume_ids
    - instances_deploy

- name: Resources Mapping including Flavors, Networks, Volume IDs
  hosts: localhost
  gather_facts: false
  connection: local
  become: true
  become_user: root

  tasks:
    - name: Verify Instance Deployment Inputs
      ansible.builtin.include_role:
        name: common
        tasks_from: verify_required_files
        apply:
          tags:
            - resources_mapping
            - instances_deploy
      vars:
        required_files:
          - name: VM inventory readiness
            path: "{{ vm_data_readiness }}"
          - name: VM resource mapping
            path: "{{ vm_resources_mapping_file }}"
          - name: VM volume mapping
            path: "{{ vm_volumes_mapping_file }}"
      tags: 
        - resources_mapping
        - instances_deploy

    - name: Load Readiness Inventory
      ansible.builtin.set_fact:
        readiness_inventory: >-
          {{
            lookup('ansible.builtin.file', vm_data_readiness)
            | from_json
          }}
      no_log: true
      tags: 
        - always

    - name: Load VM Resources Mapping
      ansible.builtin.include_vars:
        file: "{{ vm_resources_mapping_file }}"
      tags: 
        - resources_mapping
        - instances_deploy

    - name: Load VM Volumes Mapping
      ansible.builtin.include_vars:
        file: "{{ vm_volumes_mapping_file }}"
      tags: 
        - resources_mapping
        - instances_deploy

    - name: Verify VM Volumes Mapping Content
      ansible.builtin.assert:
        that:
          - vm_volumes_mapping is defined
          - vm_volumes_mapping | length > 0
        fail_msg: >-
          No VM volume mappings were found in
          '{{ vm_volumes_mapping_file }}'.
      tags: 
        - resources_mapping
        - instances_deploy

    - name: Resources mapping VMware-to-OpenStack 
      ansible.builtin.include_role:
        name: resources_mapping
        tasks_from: resources_mapping
      tags: 
        - resources_mapping
        - instances_deploy