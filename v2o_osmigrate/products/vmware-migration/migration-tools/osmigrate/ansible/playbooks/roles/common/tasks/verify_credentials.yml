---
### VMware Authentication
- name: Validate VMware credentials
  community.vmware.vmware_about_info:
    hostname: "{{ vcenter_hostname }}"
    username: "{{ vcenter_username }}"
    password: "{{ vcenter_password }}"
    validate_certs: "{{ validate_certs }}"
  register: vmware_auth_result
  delegate_to: localhost

- name: VMware authentication validated
  ansible.builtin.debug:
    msg: "VMware authentication successful."

### OpenStack Authentication
- name: Validate OpenStack credentials
  openstack.cloud.auth:
    cloud: "{{ dst_cloud }}"
  register: openstack_auth_result
  delegate_to: localhost

- name: OpenStacl authentication validated
  ansible.builtin.debug:
    msg: "OpenStacl authentication successful."
  