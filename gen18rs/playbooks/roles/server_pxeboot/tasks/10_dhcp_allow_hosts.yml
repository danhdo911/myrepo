---
  - name: Update DHCP Allow Hosts
    template:
      src: dhcpd-allow-hosts.conf.j2
      dest: /etc/dhcp/dhcpd.conf
      owner: root
      group: root
      mode: 0644
    loop: "{{ esxi_inventory }}"
    register: dhcp_config
    when: >
      item.esxi_hostname is defined and
      item.esxi_macaddr is defined

  - name: Restart DHCP service
    systemd:
      name: isc-dhcp-server
      enabled: yes
      state: restarted
    when: dhcp_config.changed