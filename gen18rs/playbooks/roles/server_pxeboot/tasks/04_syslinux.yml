---
- name: Configure syslinux
  block:
    - name: Install syslinux package
      apt:
        name: syslinux
        state: latest

    - name: Create pxelinux.cfg directory
      file:
        path: "{{ global_path_tftpboot }}/pxelinux.cfg"
        state: directory
        owner: root
        group: root
        mode: '755'



