  - name: Prepare ISCSI vmkernel port data
    set_fact:
      iscsi_port_data: |
        {{ iscsi_port_data | default([]) + 
          [{'iscsi_ip': esxi_host.esxi_iscsi_ip1, 
            'iscsi_pg': vds_iscsi_pg[0].vds_iscsi_pg_name, 
            'iscsi_gw': vds_iscsi_pg[0].vds_iscsi_gateway,
            'iscsi_net': vds_iscsi_pg[0].vds_iscsi_netmask,
            'esxi_hostname': esxi_host.esxi_hostname}] +
          [{'iscsi_ip': esxi_host.esxi_iscsi_ip2, 
            'iscsi_pg': vds_iscsi_pg[1].vds_iscsi_pg_name, 
            'iscsi_gw': vds_iscsi_pg[1].vds_iscsi_gateway,
            'iscsi_net': vds_iscsi_pg[1].vds_iscsi_netmask, 
            'esxi_hostname': esxi_host.esxi_hostname}]
        }}
    loop: "{{ esxi_info }}"
    loop_control:
      loop_var: esxi_host
    when: >
      esxi_host.esxi_iscsi_ip1 is defined and
      esxi_host.esxi_iscsi_ip2 is defined and
      vds_iscsi_pg[0].vds_iscsi_pg_name is defined and
      vds_iscsi_pg[0].vds_iscsi_gateway is defined and
      vds_iscsi_pg[0].vds_iscsi_netmask is defined and
      vds_iscsi_pg[1].vds_iscsi_pg_name is defined and
      vds_iscsi_pg[1].vds_iscsi_gateway is defined and
      vds_iscsi_pg[1].vds_iscsi_netmask is defined

  - name: Add ISCSI vmkernel ports for each ESXi host
    community.vmware.vmware_vmkernel:
      hostname: "{{ vcenter_hostname }}"
      username: "{{ vcenter_username }}"
      password: "{{ vcenter_password }}"
      validate_certs: "{{ vcenter_validate_certs }}"
      esxi_hostname: "{{ item.esxi_hostname }}"
      dvswitch_name: "{% if vds_switch02 | default(None) not in [None, ''] %}{{ vds_switch02 }}{% else %}{{ vds_switch01 }}{% endif %}"
      portgroup_name: "{{ item.iscsi_pg }}"
      mtu: "{{ mtu_vmkernel | default(9000) }}"
      network:
        type: "static"
        ip_address: "{{ item.iscsi_ip }}"
        subnet_mask: "{{ item.iscsi_net }}"
        default_gateway: "{{ item.iscsi_gw }}"
      state: present
    loop: "{{ iscsi_port_data }}"
    delegate_to: localhost