workflow:
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && 
           $CI_PIPELINE_SOURCE == "push" &&
           $TAG_TO_DEPLOYMENT =~ /^v\d+\.\d+\.\d+(-[a-zA-Z0-9._-]+)?$/'
      when: always  # Run only when the merge to main is successful with valid tag
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      when: never  # Prevent pipeline from running on MR creation
    - when: never  # Prevent all other cases

# The specific environment to deployment
include: /$ROOT_PATH/$REPO_DEPLOYMENT_DIR/group_vars/.gitlab-ci-env.yml

##################################################################
image: harbor.iij.com.vn/customized-images/iijvn-runner:v1.0

## Anchor templates - using this configure for all jobs such as: ssh cmd, after_script cmd, run manual job, tags, specific branch
## Using ansible_key - Set permissions on the SSH private key file
.ssh-script: &ssh-script
  - umask 077
  - echo "$SSH_PRIVATE_KEY" > /tmp/private_key
  - chmod 600 /tmp/private_key

## Common configuration for all jobs
.common-option: &common-option
  environment: '$ANSIBLE_ENVIRONMENT_INVENTORY'
  before_script:
    - *ssh-script
  after_script:
    # Remove the temporary key file
    - rm -f /tmp/private_key
  tags: [$SERVER_RUNNER_TAG]

## Jobs
stages:
  - Pre-setup
  - ESXi-install
  - vSphere-setup
  - Post-setup

01-Update-Lastest-Code:
  stage: Pre-setup
  script:
    # SSH into the server and execute commands
    - ssh -o StrictHostKeyChecking=no -i /tmp/private_key $HOST_USER@$SERVER_RUNNER
        "docker image ls | grep harbor.iij.com.vn/customized-images/ansible"
    ### Update latest deployment repository
    ### Update latest specific version code to use to depoyment (TAG)
    ### Synce environment and group_vars
    - ssh -o StrictHostKeyChecking=no -i /tmp/private_key $HOST_USER@$SERVER_RUNNER
        "cd /$ROOT_PATH/$REPO_DEPLOYMENT_DIR && 
          git fetch --all &&
          git switch $CI_DEFAULT_BRANCH	&&
          git pull origin $CI_DEFAULT_BRANCH &&
          ./clone_repo.sh https://$GIT_USER:$GIT_TOKEN@gitlab.iij.com.vn/iijvn-randd/$REPO_MAIN_CODE_DIR.git $REPO_MAIN_CODE_DIR"       
    - ssh -o StrictHostKeyChecking=no -i /tmp/private_key $HOST_USER@$SERVER_RUNNER
        "cd /$ROOT_PATH/$REPO_DEPLOYMENT_DIR/$REPO_MAIN_CODE_DIR &&
          git reset --hard HEAD &&
          git fetch --all --tags --force &&
          git checkout $TAG_TO_DEPLOYMENT &&
          git pull origin $TAG_TO_DEPLOYMENT"
    - ssh -o StrictHostKeyChecking=no -i /tmp/private_key $HOST_USER@$SERVER_RUNNER
        "cd /$ROOT_PATH/$REPO_DEPLOYMENT_DIR && 
          rsync -av . $REPO_MAIN_CODE_DIR/ --exclude={'.git','$REPO_MAIN_CODE_DIR'}"
  <<: [*common-option]

02-Prepare-Local-env:
  stage: Pre-setup
  needs:
    - 01-Update-Lastest-Code
  rules:
    - if: '$TAG_TO_DEPLOYMENT =~ /^v\d+\.\d+\.\d+(-[a-zA-Z0-9._-]+)?$/'
  script:
    - ssh -o StrictHostKeyChecking=no -i /tmp/private_key $HOST_USER@$SERVER_RUNNER
        "cd /$ROOT_PATH/$REPO_DEPLOYMENT_DIR/$REPO_MAIN_CODE_DIR && 
          echo CI_COMMIT_SHA_SHORT=$(echo "$CI_COMMIT_SHA" | cut -c1-8) >> .env &&
          ./scripts/verify_tag.sh $TAG_TO_DEPLOYMENT"
  <<: [*common-option]

03-Generate-vSphere-Variables:
  stage: Pre-setup
  needs:
    - 01-Update-Lastest-Code
  script:
    - ssh -o StrictHostKeyChecking=no -i /tmp/private_key $HOST_USER@$SERVER_RUNNER 
        "cd /$ROOT_PATH/$REPO_DEPLOYMENT_DIR/$REPO_MAIN_CODE_DIR &&
          ./scripts/run_playbook.sh docker-compose.esxi.yml generate_vars_env.yml $ANSIBLE_ENVIRONMENT_DEPLOYMENT $ANSIBLE_ENVIRONMENT_INVENTORY"
          #./scripts/run_playbook.sh <docker-compose file> <playbook> <env_deployment> <env_inventory>
  <<: [*common-option]
  # when: manual
  allow_failure: false

