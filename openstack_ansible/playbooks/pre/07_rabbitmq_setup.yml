---
- name: Install and configure RabbitMQ
  hosts: controller  # Target your specific host or group
  become: true

  vars:
    rabbitmq_user: "openstack"
    rabbitmq_password: "openstack"  # Replace with a secure password

  tasks:
    - name: Install RabbitMQ server
      ansible.builtin.apt:
        name: rabbitmq-server
        state: present
        update_cache: true

    - name: |-
        Add user to server and assign full access control on / vhost.
        The user doesn't have permission rules for other vhosts
      community.rabbitmq.rabbitmq_user:
        user: "{{ rabbitmq_user }}"
        password: "{{ rabbitmq_password }}"
        permissions:
          - vhost: /
            configure_priv: .*
            read_priv: .*
            write_priv: .*
        state: present

    - name: Mark RabbitMQ user addition as complete
      ansible.builtin.file:
        path: "/var/lib/rabbitmq/.rabbitmq_user_{{ rabbitmq_user }}"
        state: touch
        owner: rabbitmq
        group: rabbitmq
