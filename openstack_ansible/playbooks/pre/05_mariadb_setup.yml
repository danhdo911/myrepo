---
- name: Install and configure MariaDB
  hosts: controller
  become: true

  vars:
    mariadb_bind_address: "192.168.138.235"
    mariadb_config_file: "/etc/mysql/mariadb.conf.d/99-openstack.cnf"
    mariadb_root_password: "openstack"

  tasks:
    - name: Update package cache and install necessary packages
      ansible.builtin.apt:
        name:
          - mariadb-server
          - python3-pymysql
        state: present
        update_cache: true

    - name: Create MariaDB configuration file for OpenStack
      ansible.builtin.copy:
        dest: "{{ mariadb_config_file }}"
        content: |
          [mysqld]
          bind-address = {{ mariadb_bind_address }}
          default-storage-engine = innodb
          innodb_file_per_table = on
          max_connections = 4096
          collation-server = utf8_general_ci
          character-set-server = utf8
        owner: root
        group: root
        mode: '0644'
      notify: Restart MariaDB

    - name: Create .my.cnf file with root credentials
      ansible.builtin.copy:
        dest: "/root/.my.cnf"
        content: |
          [client]
          user = root
          password = {{ mariadb_root_password }}
        owner: root
        group: root
        mode: '0600'

    - name: Run mysql_secure_installation
      ansible.builtin.command: |
        mysql_secure_installation
      args:
        creates: /root/.my.cnf
      register: mysql_secure_install_output
      ignore_errors: true

  handlers:
    - name: Restart MariaDB
      ansible.builtin.service:
        name: mariadb
        state: restarted
