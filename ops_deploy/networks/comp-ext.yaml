network:
  version: 2
  ethernets:
    ens2f0np0:
      mtu: 9000
      dhcp4: false
    ens2f1np1:
      mtu: 9000
      dhcp4: false
    ens2f2np2:
      mtu: 9000
      dhcp4: false
    ens2f3np3:
      mtu: 9000
      dhcp4: false

  bonds:
    bond0:
      interfaces:
        - ens2f0np0
        - ens2f1np1
      parameters:
        mode: active-backup
        mii-monitor-interval: 100
      mtu: 9000

    bond1:
      interfaces:
        - ens2f2np2
        - ens2f3np3
      parameters:
        mode: active-backup
        mii-monitor-interval: 100
      mtu: 9000

  virtual-ethernets:
    veth-linux:
      peer: veth-ovs
      mtu: 9000
      dhcp4: false
      dhcp6: false
      link-local: []

    veth-ovs:
      peer: veth-linux
      mtu: 9000
      dhcp4: false
      dhcp6: false
      link-local: []

  bridges:
    br-trunk:
      interfaces:
        - bond0
        - veth-linux
      mtu: 9000
      dhcp4: false
      dhcp6: false
      link-local: []
      parameters:
        stp: false
        forward-delay: 0

  vlans:
    ### Internal
    ens33:
      id: 210
      link: br-trunk
      dhcp4: false
      mtu: 1500
      addresses:
        - 172.16.210.17/24
      routes:
        - to: default
          via: 172.16.210.1
      nameservers:
        addresses:
          - 8.8.8.8
          - 1.1.1.1

    ### Geneve
    ens35:
      id: 212
      link: br-trunk
      mtu: 9000
      dhcp4: false
      addresses:
        - 172.16.212.17/24

    ### Storage
    ens36:
      id: 213
      link: br-trunk
      mtu: 9000
      dhcp4: false
      addresses:
        - 172.16.213.17/24
