network:
  version: 2
  renderer: networkd

  ethernets:
    ens192:
      dhcp4: false
      mtu: 9000
    ens224:
      dhcp4: false
      mtu: 9000
    ens256:
      dhcp4: false
      mtu: 9000
    ens161:
      dhcp4: false
      mtu: 9000

  bonds:
    bond0:
      interfaces:
        - ens192
        - ens224
      parameters:
        mode: active-backup
        mii-monitor-interval: 100
      mtu: 9000
      dhcp4: false
      dhcp6: false
      link-local: []

    bond1:
      interfaces:
        - ens256
        - ens161
      parameters:
        mode: active-backup
        mii-monitor-interval: 100
      mtu: 9000
      dhcp4: false
      dhcp6: false
      link-local: []

  virtual-ethernets:
    veth-linux:
      peer: veth-ovs
      mtu: 9000
      dhcp4: false
      dhcp6: false
      link-local: []

    veth-ovs:
      peer: veth-linux
      mtu: 9000
      dhcp4: false
      dhcp6: false
      link-local: []

  bridges:
    br-trunk:
      interfaces:
        - bond0
        - veth-linux
      mtu: 9000
      dhcp4: false
      dhcp6: false
      link-local: []
      parameters:
        stp: false
        forward-delay: 0

  vlans:
    ### Internal API
    ens33:
      id: 885
      link: br-trunk
      mtu: 1500
      dhcp4: false
      addresses:
        - 172.16.85.14/24
      routes:
        - to: default
          via: 172.16.85.254
      nameservers:
        addresses:
          - 192.168.137.200
        search:
          - dd-iaas.local

    ### Geneve
    ens35:
      id: 886
      link: br-trunk
      mtu: 9000
      dhcp4: false
      addresses:
        - 172.16.86.14/24

    ### Storage
    ens36:
      id: 887
      link: bond1
      mtu: 9000
      dhcp4: false
      addresses:
        - 172.16.87.14/24