---
#----------------------- 1. OpenStack Core Services -----------------------#
# General
kolla_base_distro: "ubuntu"
kolla_install_type: "source"
openstack_release: "2026.1"
kolla_internal_vip_address: "172.16.85.51"
kolla_external_vip_address: "172.16.88.51"
network_interface: "ens33"
kolla_external_vip_interface: "ens34"
api_interface: "ens33"
storage_interface: "ens36"
tunnel_interface: "ens35"

# Neutron
neutron_external_interface: "eth1"
neutron_bridge_name: "br-ex1"
neutron_physical_network: "physnet1"
neutron_plugin_agent: "ovn"
enable_neutron_qos: "yes"

# FQDN
kolla_internal_fqdn: "dd261internal.dd-iaas.local"
kolla_external_fqdn: "dd261public.dd-iaas.local"

# Services
enable_openstack_core: "yes"
enable_horizon: "yes"
enable_keystone: "yes"
enable_haproxy: "yes"
enable_mariadb: "yes"
enable_mariabackup: "yes"
enable_memcached: "yes"
enable_masakari: "yes"
enable_hacluster: "yes"

# TLS
kolla_copy_ca_into_containers: "yes"
openstack_cacert: "/etc/ssl/certs/ca-certificates.crt"
kolla_enable_tls_internal: "yes"
kolla_enable_tls_external: "yes"
kolla_enable_tls_backend: "yes"
kolla_admin_openrc_cacert: "{{ openstack_cacert }}"

# Region
openstack_region_name: "HoChiMinh"

# Dummy variable to allow Ansible to accept this file.
workaround_ansible_issue_8743: yes

#-------- Nova --------#
enable_nova: "yes"
nova_compute_virt_type: "kvm"

# Ceph RBD - Nova
nova_backend_ceph: "yes"
ceph_nova_user: "cinder"
ceph_nova_pool_name: "vms"

#-------- Cinder --------#
enable_cinder: "yes"
enable_cinder_backup: "yes"
# enable_cinder_backend_iscsi: "yes"

# Ceph RBD - Cinder
cinder_backend_ceph: "yes"
ceph_cinder_user: "cinder"
ceph_cinder_pool_name: "volumes"

# Cinder backup using Ceph
cinder_backup_driver: "ceph"
ceph_cinder_backup_user: "cinder-backup"
ceph_cinder_backup_pool_name: "backups"

#-------- Glance --------#
enable_glance: "yes"

# Ceph RBD - Glance
glance_backend_ceph: "yes"
ceph_glance_user: "glance"
ceph_glance_pool_name: "images"

#-------- Skyline --------#
enable_skyline: "yes"

# Proxy
# container_http_proxy: ""
# container_https_proxy: ""
# container_no_proxy: ""
