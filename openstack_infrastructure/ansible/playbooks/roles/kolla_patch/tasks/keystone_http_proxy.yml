---
- name: Replace defaults configuration in Keystone
  ansible.builtin.copy:
    src: "{{openstack_release}}/keystone_http_proxy/{{ item }}"
    dest: "{{ kolla_keystone_defaults_dir }}/main.yml"
    owner: root
    group: root
    mode: '0640'
    backup: true
  loop: "{{ keystone_http_proxy.defaults }}"

- name: Replace handlers configuration in Keystone
  ansible.builtin.copy:
    src: "{{openstack_release}}/keystone_http_proxy/{{ item }}"
    dest: "{{ kolla_keystone_handlers_dir }}/main.yml"
    owner: root
    group: root
    mode: '0640'
    backup: true
  loop: "{{ keystone_http_proxy.handlers }}"
