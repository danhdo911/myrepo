---
- name: Copy passwords file from Kolla Ansible
  ansible.builtin.copy:
    remote_src: yes
    src: "{{ workdir_openstack }}/{{ kolla_venv }}/share/kolla-ansible/etc_examples/kolla/passwords.yml"
    dest: "{{ kolla_dir }}/passwords.yml"
    owner: root
    group: root
    mode: '0600'
    force: false
  register: _passwords_result

- name: Generate kolla-ansible passwords
  ansible.builtin.shell: |
    source {{ workdir_openstack }}/{{ kolla_venv }}/bin/activate
    kolla-genpwd
  args:
    executable: /bin/bash
  register: _genpwd_result
  failed_when: _genpwd_result.rc != 0
  changed_when: false
  when: _passwords_result.changed