---
- name: Inventory file for Kolla Ansible
  ansible.builtin.template:
    src: "{{openstack_release}}/multinode.j2"
    dest: "{{ workdir_openstack }}/multinode"
    owner: root
    group: root
    mode: '0644'

- name: Test connectivity to all hosts in inventory
  ansible.builtin.shell: |
    source {{ workdir_openstack }}/{{ kolla_venv }}/bin/activate
    ansible all -i {{ workdir_openstack }}/multinode -m ping
  args:
    executable: /bin/bash
  register: _ping_result
  failed_when: _ping_result.rc != 0
  changed_when: false