- name: Add dns to /etc/hosts
  hosts: all
  become: yes
  tasks:
    - name: Empty /etc/hosts
      ansible.builtin.shell: "truncate -s 0 /etc/hosts"

    # - name: Add current host to /etc/hosts
    #   lineinfile:
    #     path: /etc/hosts
    #     line: "{{ ansible_host }} {{ inventory_hostname }}"
    #     create: yes
    #     state: present
    #   when: ansible_host is defined

    # - name: Load VMs Data
    #   ansible.builtin.include_tasks: "../tasks/vms_data.yml"

    - name: Ensure required host entries are in /etc/hosts
      ansible.builtin.lineinfile:
        path: /etc/hosts
        create: yes
        line: "{{ item }}"
      loop:
        - "{{ kolla_internal_vip_address }} {{ kolla_internal_fqdn }}"
        - "{{ kolla_external_vip_address }} {{ kolla_external_fqdn }}"
        # - "172.20.20.11 ddops-ctrl01.{{ kolla_internal_fqdn }}"
        # - "172.20.20.13 ddops-gw01.{{ kolla_internal_fqdn }}"
        # - "172.20.20.14 ddops-com01.{{ kolla_internal_fqdn }}"