- name: Install required packages on Ubuntu
  hosts: mgmt_servers
  become: yes

  vars:
    cloud_archive_version: "caracal"
    repo_url: "http://ubuntu-cloud.archive.canonical.com/ubuntu jammy-updates/{{ cloud_archive_version }} main"

  tasks:
    - name: Ensure software-properties-common is installed
      apt:
        name: software-properties-common
        state: present
        update_cache: yes

    - name: Add specified repository into sources list using specified filename
      apt_repository:
        repo: deb {{ repo_url }}
        state: present
        filename: cloudarchive-{{ cloud_archive_version }}

    - name: Update and upgrade packages
      apt:
        update_cache: yes
        upgrade: dist

    - name: Reboot system if needed
      reboot:
        msg: "Reboot initiated by Ansible after dist-upgrade"
      when: ansible_facts['os_family'] == "Ubuntu"

    - name: Install python3-openstackclient
      apt:
        name: python3-openstackclient
        state: present
