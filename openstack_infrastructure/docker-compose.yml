services:
  terraform:
    image: hashicorp/terraform:1.10.3
    volumes:
      - .:/workspace
    working_dir: /workspace
    environment:
      - VAULT_TOKEN=${VAULT_TOKEN}
    entrypoint: ["sh", "-c"]

  ansible:
    image: alpine/ansible:2.18.6
    volumes:
      - .:/workspace
      - /tmp:/tmp
    working_dir: /workspace
    environment:
      - VAULT_TOKEN=${VAULT_TOKEN}
    entrypoint: ["sh", "-c"]
