### Working directory
work_dir: "{{ lookup('ansible.builtin.env', 'WORK_DIR') }}"

### Inventories
ansible_user: "ubuntu"
ansible_ssh_private_key_file: "{{ work_dir }}/ansible_private_key"

### HashiVault
hashi_vault: 'community.hashi_vault.hashi_vault'
hashi_vault_query_base: >-
  url={{ lookup('ansible.builtin.env', 'VAULT_ADDR') }}
  token={{ lookup('ansible.builtin.env', 'VAULT_TOKEN') }}
  secret={{ lookup('ansible.builtin.env', 'TF_VAR_vault_path_base') }}
hashi_vault_datapath: "{{ lookup('ansible.builtin.env', 'TF_VAR_vault_secret_data') }}"
hv: "{{ lookup(hashi_vault, hashi_vault_query_base+hashi_vault_datapath) }}"
