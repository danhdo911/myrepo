################## OS Baseline Setup ##################
### DNS
dns_servers: [172.16.85.9]
search_domain: ["dd-iaas.local"]

# HA VIP
kolla_internal_fqdn: "dd251internal.dd-iaas.local"
kolla_internal_vip_address: "172.16.85.52"
kolla_external_fqdn: "dd251public.dd-iaas.local"
kolla_external_vip_address: "172.16.88.52"

### Proxy
proxy_enabled: true
proxy_host: "172.16.81.168"
proxy_port: "8080"
no_proxy_list:
  - localhost
  - 127.0.0.1
  - ::1
  - 172.16.
  - .dd-iaas.local

### NTP
ntp_servers: [192.168.138.235, 192.168.137.200]

### Hardening OS
hardening_enabled: false
hardening_repo: "https://api.github.com/repos/ComplianceAsCode/content/releases/latest"
hardening_os_version: "ubuntu2404"
hardening_cis_level: "cis_level1"

### SSH Administrator
ssh_admin_users:
  - ssh_user: root
    ssh_public_key: "{{ hv.ansible_public_key }}"
